name: VMate
options:
  bundleIdPrefix: com.takmin.vmate
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  # Shipaton 2026 応募要件("uses the RevenueCat SDK to power in-app purchases")のため、
  # 自前StoreKit2実装からRevenueCat SDK経由へ移行(2026-07-22)。
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
schemes:
  VMate:
    build:
      targets:
        VMate: all
    run:
      config: Debug
      # ローカル StoreKit Testing Configuration。App Store Connect への商品登録前でも
      # シミュレータで購入/復元フローを検証できるようにする(feedback-xcode-no-simulator-launch:
      # 実機能検証は build_sim/test_sim に留め、対話的シミュレータ起動はしない方針と両立)。
      storeKitConfiguration: VMate/VMate.storekit
    test:
      config: Debug
      targets:
        - VMateTests
targets:
  VMate:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VMate/Sources
      - path: VMate/VMate.storekit
        buildPhase: none
    info:
      path: VMate/Info.plist
      properties:
        CFBundleDisplayName: V-Mate
        NSMicrophoneUsageDescription: "シロと声で会話するためにマイクを使います。"
        NSSpeechRecognitionUsageDescription: "あなたの声をその場で文字にしてシロに伝えるために使います。音声は会話の認識にのみ使われます。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takmin.vmate
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NVZB82UK53
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: RevenueCat
  VMateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VMate/Tests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VMate
